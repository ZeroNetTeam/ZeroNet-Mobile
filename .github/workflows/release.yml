name: release

# Push a tag like `v0.2.0` and the Android APKs land on the GitHub Releases
# page. Running it by hand builds the same files as workflow artifacts without
# publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish as this tag (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Its default list includes the legacy "tools" package, which the
          # SDK repository no longer carries, failing the step.
          packages: platform-tools
      # Platform and build tools are installed by the Android Gradle plugin
      # from compileSdk; the NDK version is what the Rust build is tested on.
      - name: NDK
        run: sdkmanager "ndk;29.0.14206865"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
      - run: cargo install cargo-ndk --locked
      # Optional: a real signing key from repository secrets, so installed
      # copies can be updated in place. Without it the APKs are signed with
      # a throwaway debug key.
      - name: signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      # The key made by the "create Android signing key" workflow: committed
      # encrypted, opened here with the password secret.
      - name: signing key (encrypted in the repository)
        env:
          PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        if: env.HAS_KEYSTORE != 'true' && env.HAS_SIGNING_PASSWORD == 'true'
        run: |
          if [ ! -f signing/release.p12.enc ]; then
            echo "::error::ANDROID_SIGNING_PASSWORD is set but there is no key yet. Run the 'create Android signing key' workflow once."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/release.p12.enc -out release.p12 -pass env:PASSWORD
          {
            echo "storeFile=release.p12"
            echo "storePassword=$PASSWORD"
            echo "keyAlias=zeronet"
            echo "keyPassword=$PASSWORD"
          } > keystore.properties
      # Without a key the APKs are signed with a throwaway one, and Android
      # will not install them over the previous release.
      - name: warn about unsigned builds
        if: env.HAS_KEYSTORE != 'true' && env.HAS_SIGNING_PASSWORD != 'true'
        run: echo "::warning::No Android signing key; these APKs cannot update an installed copy. See .github/workflows/signing-key.yml."
      - name: build APKs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          version="${RELEASE_TAG#v}"
          ./gradlew --no-daemon assembleRelease ${version:+-PzeronetVersion=$version}
      - name: collect
        run: |
          mkdir -p dist
          out=app/build/outputs/apk/release
          cp "$out/app-universal-release.apk"   dist/ZeroNet-Android-universal.apk
          cp "$out/app-arm64-v8a-release.apk"   dist/ZeroNet-Android-arm64-v8a.apk
          cp "$out/app-armeabi-v7a-release.apk" dist/ZeroNet-Android-armeabi-v7a.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android
          path: dist/*

  publish:
    name: publish release
    # A pushed tag, or a manual run given a version: the release action then
    # creates the tag on this commit.
    if: github.ref_type == 'tag' || inputs.version != ''
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      # The in-app updater checks what it downloaded against this list.
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ZeroNet Mobile ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## دانلود / Download

            | | Download this | |
            |---|---|---|
            | Android, any phone | `ZeroNet-Android-universal.apk` | Install it |

            `arm64-v8a` is a smaller download and fits almost every modern phone; `armeabi-v7a` is for old 32-bit phones. If you are not sure, take `universal`.

            اندروید : فایل `ZeroNet-Android-universal.apk` رو نصب کن . اگه گوشیت جدیده فایل `arm64-v8a` کم حجم تره . اگه مطمئن نیستی `universal` رو بگیر و اگه پرسید اجازه ی نصب از منابع ناشناس رو بده .

            کامپیوتر : [ZeroNet-Desktop](https://github.com/ZeroNetTeam/ZeroNet-Desktop/releases/latest) . برنامه ی خط فرمان برای سرور و روتر : [Zray-Core](https://github.com/ZeroNetTeam/Zray-Core/releases/latest) .

            راهنمای کامل فارسی توی [README](https://github.com/${{ github.repository }}#readme) هست.
